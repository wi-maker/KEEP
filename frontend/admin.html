<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEEP - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            keep: {
              dark: '#0F5A3C',
              green: '#1B4D3E',
              light: '#E6F4F1',
              accent: '#A8D8C9',
              text: '#1F2937',
              muted: '#6B7280',
              bg: '#F3F4F6'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }

  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .sidebar-link.active {
      background-color: #E6F4F1;
      color: #0F5A3C;
      font-weight: 600;
    }

    .sidebar-link:hover:not(.active) {
      background-color: #F3F4F6;
    }

    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile sidebar transitions */
    #sidebar {
      transition: transform 0.3s ease-in-out;
    }

    @media (max-width: 1023px) {
      #sidebar.sidebar-open {
        transform: translateX(0) !important;
      }
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-900 h-screen flex overflow-hidden">

  <!-- Mobile backdrop overlay -->
  <div id="sidebar-backdrop" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

  <!-- SIDEBAR - Collapsible on mobile -->
  <aside id="sidebar"
    class="w-64 bg-white border-r border-gray-200 flex flex-col fixed lg:static inset-y-0 left-0 z-50 -translate-x-full lg:translate-x-0">
    <div class="h-16 px-6 border-b border-gray-200 flex items-center justify-between">
      <div class="flex items-end gap-1">
        <h1 class="text-2xl font-bold text-keep-dark" style="font-family: 'Playfair Display', serif;">keep</h1>
        <div class="flex flex-col gap-[1px] mb-1">
          <span class="w-1 h-1 rounded-full bg-keep-accent"></span>
          <span class="w-1 h-1 rounded-full bg-keep-green"></span>
          <span class="w-1 h-1 rounded-full bg-keep-dark"></span>
        </div>
      </div>
      <span class="text-xs font-semibold text-gray-400">ADMIN</span>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-1">
      <a href="#overview" data-route="overview"
        class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600">
        <i class="fas fa-chart-line w-5 text-center"></i>
        <span class="text-sm font-medium">Overview</span>
      </a>
      <a href="#users" data-route="users"
        class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600">
        <i class="fas fa-users w-5 text-center"></i>
        <span class="text-sm font-medium">Users</span>
      </a>
      <a href="#records" data-route="records"
        class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600">
        <i class="fas fa-folder-open w-5 text-center"></i>
        <span class="text-sm font-medium">Records</span>
      </a>
      <a href="#ai" data-route="ai" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600">
        <i class="fas fa-robot w-5 text-center"></i>
        <span class="text-sm font-medium">AI Usage</span>
      </a>
      <a href="#announcements" data-route="announcements"
        class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600">
        <i class="fas fa-bullhorn w-5 text-center"></i>
        <span class="text-sm font-medium">Announcements</span>
      </a>
      <a href="#system" data-route="system"
        class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600">
        <i class="fas fa-server w-5 text-center"></i>
        <span class="text-sm font-medium">System</span>
      </a>
    </nav>

    <div class="p-4 border-t border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-keep-dark flex items-center justify-center text-white text-sm font-bold">A
        </div>
        <div>
          <p class="text-sm font-medium text-gray-900">Admin</p>
          <p class="text-xs text-gray-500">Super Admin</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col overflow-hidden">

    <header class="h-16 flex items-center justify-between px-4 md:px-6 lg:px-8 bg-white border-b border-gray-200">
      <div class="flex items-center gap-3">
        <!-- Mobile menu button -->
        <button onclick="toggleSidebar()" class="lg:hidden text-gray-600 hover:text-gray-900 p-1">
          <i class="fas fa-bars text-xl"></i>
        </button>
        <div>
          <h1 class="text-lg md:text-xl font-bold text-gray-900" id="page-title">Overview</h1>
          <p class="text-xs text-gray-500 hidden sm:block" id="page-subtitle">Platform analytics and system health</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="relative">
          <button onclick="toggleNotifications()" class="text-gray-400 hover:text-gray-600 relative">
            <i class="far fa-bell text-xl"></i>
            <span id="notification-badge" class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>

          <!-- Notification Dropdown -->
          <div id="notification-dropdown"
            class="hidden absolute right-0 top-10 w-80 bg-white rounded-xl shadow-xl border border-gray-100 z-50 overflow-hidden">

              <h3 class="font-bold text-gray-900">Notifications</h3>
              <button onclick="toggleNotifications()" class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div id="notification-list" class="max-h-80 overflow-y-auto">
              <!-- Dynamic content will be loaded here -->
              <div class="p-8 text-center">
                <i class="fas fa-bell text-gray-300 text-3xl mb-2"></i>
                <p class="text-sm text-gray-500">Click to load notifications</p>
              </div>
            </div>
            <div class="p-3 border-t border-gray-100 bg-gray-50">
              <button onclick="markAllRead()"
                class="text-sm text-keep-dark hover:underline w-full text-center font-medium">
                Mark all as read
              </button>
            </div>
          </div>
        </div>
        <button onclick="goToMainApp()"
          class="text-sm text-gray-600 hover:text-keep-dark font-medium flex items-center gap-2">
          <i class="fas fa-arrow-left"></i> Back to App
        </button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto px-4 md:px-6 lg:px-8 py-4 md:py-6" id="main-content">
      <!-- Content will be dynamically loaded here -->
    </div>
  </main>

  <script>

    // ============================================
    // SIDEBAR FUNCTIONS (Mobile responsiveness)
    // ============================================
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const isOpen = sidebar.classList.contains('sidebar-open');

      if (isOpen) {
        closeSidebar();
      } else {
        sidebar.classList.add('sidebar-open');
        backdrop.classList.remove('hidden');
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      sidebar.classList.remove('sidebar-open');
      backdrop.classList.add('hidden');
    }

    // ============================================
    // NOTIFICATION FUNCTIONS
    // ============================================
    function toggleNotifications() {
      const dropdown = document.getElementById('notification-dropdown');
      const isHidden = dropdown.classList.contains('hidden');
      dropdown.classList.toggle('hidden');

      // Load notifications when opening
      if (isHidden) {
        loadNotifications();
      }
    }

    function closeNotifications() {
      const dropdown = document.getElementById('notification-dropdown');
      if (dropdown && !dropdown.classList.contains('hidden')) {
        dropdown.classList.add('hidden');
      }
    }

    // Close notification dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('notification-dropdown');
      const bellButton = e.target.closest('[onclick*="toggleNotifications"]');
      const dropdownElement = e.target.closest('#notification-dropdown');

      // If click is not on bell button and not inside dropdown, close it
      if (dropdown && !dropdown.classList.contains('hidden') && !bellButton && !dropdownElement) {
        dropdown.classList.add('hidden');
      }
    });

    async function loadNotifications() {
      const listEl = document.getElementById('notification-list');

      // Show loading state
      listEl.innerHTML = `
        <div class="p-8 text-center">
          <div class="animate-spin w-8 h-8 border-4 border-keep-green border-t-transparent rounded-full mx-auto mb-2"></div>
          <p class="text-xs text-gray-500">Loading notifications...</p>
        </div>
      `;

      const notifications = await fetchData('notifications');

      // Handle error state
      if (notifications === null) {
        listEl.innerHTML = `
          <div class="p-8 text-center">
            <i class="fas fa-exclamation-circle text-red-300 text-3xl mb-2"></i>
            <p class="text-sm text-gray-500">Failed to load notifications</p>
            <button onclick="loadNotifications()" class="text-xs text-keep-dark hover:underline mt-2">Retry</button>
          </div>
        `;
        return;
      }

      // Handle empty state
      if (!notifications || notifications.length === 0) {
        listEl.innerHTML = `
          <div class="p-8 text-center">
            <i class="fas fa-bell-slash text-gray-300 text-3xl mb-2"></i>
            <p class="text-sm text-gray-500">No notifications</p>
            <p class="text-xs text-gray-400 mt-1">You're all caught up!</p>
          </div>
        `;
        return;
      }

      // Render notifications
      listEl.innerHTML = notifications.map((n, index) => {
        const isLast = index === notifications.length - 1;
        const iconMap = {
          user: 'fa-user-plus',
          record: 'fa-file-medical',
          ai: 'fa-robot',
          system: 'fa-server',
          share: 'fa-share-alt'
        };
        const icon = iconMap[n.type] || 'fa-bell';

        return `
          <div class="p-4 ${isLast ? '' : 'border-b border-gray-50'} hover:bg-gray-50 cursor-pointer ${n.read ? 'opacity-60' : ''}">
            <div class="flex gap-3">
              <div class="w-8 h-8 bg-keep-light rounded-full flex items-center justify-center flex-shrink-0">
                <i class="fas ${icon} text-keep-dark text-sm"></i>
              </div>
              <div class="flex-1">
                <p class="text-sm text-gray-900 font-medium">${n.title}</p>
                <p class="text-xs text-gray-500">${n.message}</p>
                <p class="text-xs text-gray-400 mt-1">${n.time}</p>
              </div>
              ${!n.read ? '<div class="w-2 h-2 bg-keep-dark rounded-full flex-shrink-0 mt-2"></div>' : ''}
            </div>
          </div>
        `;
      }).join('');

      // Update badge visibility
      const unreadCount = notifications.filter(n => !n.read).length;
      const badge = document.getElementById('notification-badge');
      if (badge) {
        badge.classList.toggle('hidden', unreadCount === 0);
      }
    }

    // Mark all notifications as read and close dropdown
    function markAllRead() {
      const badge = document.getElementById('notification-badge');
      if (badge) badge.classList.add('hidden');

      // Visually mark all as read in the list
      const listEl = document.getElementById('notification-list');
      if (listEl) {
        listEl.querySelectorAll('[class*="opacity"]').forEach(el => {
          el.classList.add('opacity-60');
        });
        // Remove unread dot indicators
        listEl.querySelectorAll('.bg-keep-dark.rounded-full.w-2.h-2').forEach(el => el.remove());
      }
    }

    // ============================================
    // CONFIGURATION
    // Set USE_MOCK_DATA to false to use real API
    // ============================================
    const USE_MOCK_DATA = false;  // CHANGED: Use real API
    const API_BASE_URL = 'https://keep-production-7d09.up.railway.app/api/v1';

    // Main App URL - Relative path since admin is on same domain
    // This enables session sharing with the main app
    const MAIN_APP_URL = './';

    // Supabase Configuration (same as main app)
    const SUPABASE_URL = 'https://obrguyijeairiokbnyzv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9icmd1eWlqZWFpcmlva2JueXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMDE0NDcsImV4cCI6MjA4Mzg3NzQ0N30.0h32ecqonTVbleN-CrXe9JR6Zc6epPnsHuVTEbcR-HE';

    // Initialize Supabase client
    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error('Supabase Init Error:', e);
    }

    // API Endpoints Map - Update paths when backend routes change
    const API_ENDPOINTS = {
      overview: '/admin/overview',
      users: '/admin/users',
      records: '/admin/records',
      ai: '/admin/ai',
      announcements: '/admin/announcements',
      notifications: '/admin/notifications',
      system: '/admin/system'
    };

    // ============================================
    // AUTHENTICATION HELPERS
    // Uses Supabase session (same as main app)
    // ============================================
    async function getAuthToken() {
      if (!supabaseClient) return null;
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        return session?.access_token || null;
      } catch (e) {
        console.error('Failed to get auth token:', e);
        return null;
      }
    }

    async function isAuthenticated() {
      return !!(await getAuthToken());
    }

    function logout() {
      if (supabaseClient) {
        supabaseClient.auth.signOut();
      }
      window.location.href = MAIN_APP_URL;
    }

    function goToMainApp() {
      window.location.href = MAIN_APP_URL;
    }

    // Check admin access on page load
    async function checkAdminAccess() {
      const mainContent = document.getElementById('main-content');

      const token = await getAuthToken();
      if (!token) {
        console.warn('Not authenticated');
        // Show login required message instead of redirecting
        mainContent.innerHTML = `
          <div class="flex flex-col items-center justify-center py-20">
            <div class="w-20 h-20 bg-keep-light rounded-full flex items-center justify-center mb-6">
              <i class="fas fa-lock text-keep-dark text-4xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Authentication Required</h2>
            <p class="text-gray-500 text-center max-w-md mb-6">
              You need to log in first to access the admin dashboard. 
              Please sign in via the main app, then return here.
            </p>
            <a href="${MAIN_APP_URL}" class="px-6 py-3 bg-keep-dark text-white rounded-xl font-semibold hover:bg-keep-green transition-colors">
              <i class="fas fa-sign-in-alt mr-2"></i>Go to Login
            </a>
          </div>
        `;
        return false;
      }

      // Test admin endpoint to verify admin status
      try {
        const response = await fetch(`${API_BASE_URL}/admin/overview`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 403) {
          mainContent.innerHTML = `
            <div class="flex flex-col items-center justify-center py-20">
              <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mb-6">
                <i class="fas fa-ban text-red-400 text-4xl"></i>
              </div>
              <h2 class="text-2xl font-bold text-gray-900 mb-2">Access Denied</h2>
              <p class="text-gray-500 text-center max-w-md mb-6">
                Your account does not have admin privileges. 
                Contact the system administrator to request access.
              </p>
              <a href="${MAIN_APP_URL}" class="px-6 py-3 bg-gray-600 text-white rounded-xl font-semibold hover:bg-gray-700 transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back to App
              </a>
            </div>
          `;
          return false;
        }

        if (!response.ok) {
          throw new Error('Admin access check failed');
        }

        return true;
      } catch (error) {
        console.error('Admin access check failed:', error);
        mainContent.innerHTML = `
          <div class="flex flex-col items-center justify-center py-20">
            <div class="w-20 h-20 bg-yellow-50 rounded-full flex items-center justify-center mb-6">
              <i class="fas fa-exclamation-triangle text-yellow-500 text-4xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Connection Error</h2>
            <p class="text-gray-500 text-center max-w-md mb-6">
              Could not connect to the server. Please check your internet connection and try again.
            </p>
            <button onclick="location.reload()" class="px-6 py-3 bg-keep-dark text-white rounded-xl font-semibold hover:bg-keep-green transition-colors">
              <i class="fas fa-redo mr-2"></i>Retry
            </button>
          </div>
        `;
        return false;
      }
    }

    // ============================================
    // MOCK DATA
    // Structured to match expected backend response schema
    // ============================================
    const MOCK_DATA = {}; // DISABLED: Using real API only

    // ============================================
    // UI STATE HELPERS
    // Returns HTML for loading, empty, and error states
    // ============================================

    // Loading skeleton HTML
    function getLoadingState() {
      return `
        <div class="flex flex-col items-center justify-center py-20">
          <div class="animate-spin w-12 h-12 border-4 border-keep-green border-t-transparent rounded-full mb-4"></div>
          <p class="text-gray-500 font-medium">Loading data...</p>
        </div>
      `;
    }

    // Empty state HTML
    function getEmptyState(title = 'No Data Available', message = 'There is no data to display at this time.') {
      return `
        <div class="flex flex-col items-center justify-center py-20">
          <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
            <i class="fas fa-inbox text-gray-300 text-4xl"></i>
          </div>
          <h3 class="text-lg font-bold text-gray-900 mb-2">${title}</h3>
          <p class="text-gray-500 text-sm text-center max-w-md">${message}</p>
        </div>
      `;
    }

    // Error state HTML
    function getErrorState(message = 'Failed to load data. Please try again.') {
      return `
        <div class="flex flex-col items-center justify-center py-20">
          <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mb-4">
            <i class="fas fa-exclamation-triangle text-red-400 text-4xl"></i>
          </div>
          <h3 class="text-lg font-bold text-gray-900 mb-2">Error Loading Data</h3>
          <p class="text-gray-500 text-sm mb-4 text-center max-w-md">${message}</p>
          <button onclick="location.reload()" class="px-4 py-2 bg-keep-dark text-white rounded-lg text-sm font-medium hover:bg-keep-green transition-colors">
            <i class="fas fa-redo mr-2"></i>Retry
          </button>
        </div>
      `;
    }

    async function fetchData(endpoint) {
      try {
        if (USE_MOCK_DATA) {
          // Simulate network delay
          await new Promise(resolve => setTimeout(resolve, 500));
          return MOCK_DATA[endpoint];
        }

        // Check authentication
        const token = await getAuthToken();
        if (!token) {
          console.warn('No auth token found');
          window.location.href = MAIN_APP_URL;
          return null;
        }

        // Real API call
        const apiEndpoint = API_ENDPOINTS[endpoint] || `/admin/${endpoint}`;
        const response = await fetch(`${API_BASE_URL}${apiEndpoint}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        // Handle 401 Unauthorized
        if (response.status === 401) {
          console.warn('Unauthorized - token may be expired');
          logout();
          return null;
        }

        // Handle 403 Forbidden (not admin)
        if (response.status === 403) {
          alert('Access Denied: Admin privileges required.');
          window.location.href = MAIN_APP_URL;
          return null;
        }

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        return await response.json();
      } catch (error) {
        console.error(`Error fetching ${endpoint}:`, error);
        return null;
      }
    }

    // Helper for POST requests (announcements, etc.)
    async function postData(endpoint, data) {
      try {
        if (USE_MOCK_DATA) {
          await new Promise(resolve => setTimeout(resolve, 300));
          console.log('Mock POST:', endpoint, data);
          return { success: true, message: 'Mock request successful' };
        }

        const token = await getAuthToken();
        if (!token) {
          console.warn('No auth token found');
          logout();
          return null;
        }

        const apiEndpoint = API_ENDPOINTS[endpoint] || `/admin/${endpoint}`;
        const response = await fetch(`${API_BASE_URL}${apiEndpoint}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        if (response.status === 401) {
          console.warn('Unauthorized - token may be expired');
          logout();
          return null;
        }

        if (response.status === 403) {
          alert('Access Denied: Admin privileges required.');
          window.location.href = MAIN_APP_URL;
          return null;
        }

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        return await response.json();
      } catch (error) {
        console.error(`Error posting to ${endpoint}:`, error);
        return null;
      }
    }

    // ============================================
    // CHART UTILITIES
    // Manages Chart.js instances for proper cleanup
    // ============================================
    const chartInstances = {};

    // Destroys existing chart before creating new one (prevents memory leaks)
    function resetChart(id) {
      if (chartInstances[id]) {
        chartInstances[id].destroy();
        delete chartInstances[id];
      }
    }

    // ============================================
    // ROUTING
    // Maps hash routes to render functions
    // ============================================
    const routes = {
      overview: renderOverview,
      users: renderUsers,
      records: renderRecords,
      ai: renderAI,
      announcements: renderAnnouncements,
      system: renderSystem
    };

    function navigate(route) {
      // Close notification dropdown when navigating
      closeNotifications();

      // Close sidebar on mobile
      closeSidebar();

      const links = document.querySelectorAll('.sidebar-link');
      links.forEach(link => {
        link.classList.toggle('active', link.dataset.route === route);
      });

      const titles = {
        overview: { title: 'Overview', subtitle: 'Platform analytics and system health' },
        users: { title: 'Users', subtitle: 'User analytics and management' },
        records: { title: 'Records', subtitle: 'Document uploads and trends' },
        ai: { title: 'AI Usage', subtitle: 'AI requests and token tracking' },
        announcements: { title: 'Announcements', subtitle: 'Platform notifications and updates' },

    async function renderSystem() {
      // Show loading state first
      document.getElementById('main-content').innerHTML = getLoadingState();

      const data = await fetchData('system');

      // Handle error/empty state
      if (!data) {
        document.getElementById('main-content').innerHTML = getErrorState('Could not load system data. Please check your connection.');
        return;
      }

      document.getElementById('main-content').innerHTML = `
        <!-- Service Status -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-8">
          <h3 class="text-lg font-bold text-gray-900 mb-4">Service Status</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${data.services.map(service => `
              <div class="p-4 border border-gray-100 rounded-lg">
                <div class="flex items-center justify-between mb-2">
                  <h4 class="font-medium text-gray-900">${service.name}</h4>
                  <span class="px-2 py-1 text-xs font-bold rounded-full ${service.status === 'healthy' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                    ${service.status === 'healthy' ? 'Healthy' : 'Down'}
                  </span>
                </div>
                <div class="flex items-center justify-between text-sm">
                  <span class="text-gray-500">Uptime: ${service.uptime}%</span>
                  <span class="text-gray-400 text-xs">${service.last_check}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- System Logs -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100">
          <div class="p-6 border-b border-gray-100 flex items-center justify-between">
            <h3 class="text-lg font-bold text-gray-900">Recent Logs</h3>
            <button class="text-sm text-keep-dark hover:text-keep-green font-medium">
              <i class="fas fa-download mr-2"></i>Export Logs
            </button>
          </div>
          <div class="divide-y divide-gray-100">
            ${data.recent_logs.map(log => `
              <div class="px-6 py-4 hover:bg-gray-50">
                <div class="flex items-start gap-4">
                  <span class="px-2 py-1 text-xs font-bold rounded-full ${log.level === 'info' ? 'bg-blue-100 text-blue-700' :
          log.level === 'warning' ? 'bg-yellow-100 text-yellow-700' :
            'bg-red-100 text-red-700'
        }">
                    ${log.level.toUpperCase()}
                  </span>
                  <div class="flex-1">
                    <p class="text-sm text-gray-900">${log.message}</p>
                    <p class="text-xs text-gray-500 mt-1">${log.time}</p>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function getActivityIcon(type) {
      const icons = {
        user: 'user-plus',
        record: 'file-medical',
        ai: 'robot',
        share: 'share-alt'
      };
      return icons[type] || 'info-circle';
    }

    async function createAnnouncement() {
      const title = document.getElementById('announcement-title').value;
      const message = document.getElementById('announcement-message').value;
      const type = document.getElementById('announcement-type').value;
      // target is not used in backend yet, but kept for UI consistency or future use

      if (!title || !message) {
        alert('Please fill in all fields');
        return;
      }

      const button = document.querySelector('button[onclick="createAnnouncement()"]');
      const originalText = button.innerText;
      button.innerText = 'Sending...';
      button.disabled = true;

      const result = await postData('announcements', { title, message, type });

      button.innerText = originalText;
      button.disabled = false;

      if (result) {
        // Show success message
        alert('Announcement sent successfully!');

        // Clear form
        document.getElementById('announcement-title').value = '';
        document.getElementById('announcement-message').value = '';
      } else {
        alert('Failed to send announcement. Please try again.');
      }
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Check if user is authenticated and is admin
      const isAdmin = await checkAdminAccess();
      if (!isAdmin) return; // checkAdminAccess shows appropriate message

      // 2. Load page content if admin
      const route = location.hash.slice(1) || 'overview';
      navigate(route);

      // Setup sidebar click handlers
      document.querySelectorAll('.sidebar-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const route = link.dataset.route;
          location.hash = route;
        });
      });
    });
  </script>
